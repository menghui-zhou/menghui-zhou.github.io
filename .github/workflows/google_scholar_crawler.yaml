name: Update Google Scholar Citations

"on":
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/google_scholar_crawler.yaml'
      - 'google_scholar_crawler/**'
      - '_pages/about.md'

permissions:
  contents: write

concurrency:
  group: google-scholar-citations
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch Google Scholar citation total
        env:
          GOOGLE_SCHOLAR_ID: t8Y_gnsAAAAJ
        run: python google_scholar_crawler/main.py
      - name: Save the latest successful data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _data/google-scholar.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Update Google Scholar citation total'
          git pull --rebase origin main
          git push origin HEAD:main
