<script>
(function () {
    function showCitations(data) {
        if (data.scholar_id !== 't8Y_gnsAAAAJ' || !Number.isInteger(data.citedby) || data.citedby < 0) {
            throw new Error('Invalid Google Scholar citation data');
        }
        var total = document.getElementById('total_cit');
        if (total) {
            total.textContent = data.citedby.toLocaleString('en-GB');
            if (data.updated) {
                total.title = 'Last checked: ' + data.updated.slice(0, 10);
            }
        }
    }
    var source = 'https://raw.githubusercontent.com/{{ site.repository }}/main/_data/google-scholar.json';
    fetch(source, {cache: 'no-store', signal: AbortSignal.timeout(10000)})
        .then(function (response) {
            if (!response.ok) { throw new Error('Citation data unavailable'); }
            return response.json();
        })
        .then(showCitations)
        .catch(function () {
            // Keep the last verified count rendered by Jekyll if fetching fails.
        });
})();
</script>
